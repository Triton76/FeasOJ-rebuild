server:
  addr: 127.0.0.1:8082

mysql:
  dsn: feasoj:feasoj@tcp(127.0.0.1:3307)/feasoj_rebuild?charset=utf8mb4&parseTime=True&loc=UTC

jwt:
  secret: local-dev-secret
  issuer: feasoj-backend-rebuild
  expire_hours: 72

judge:
  writeback_token: ""

scheduler:
  contest_status_scan_seconds: 30

feature_flags:
  enable_judge_writeback: true
  enable_scoreboard: true
  enable_testcase_apis: false
  enable_rabbitmq_queue: false
  enable_embedded_judge_worker: true
  enable_class_workflow_v2: true

rabbitmq:
  url: amqp://guest:guest@localhost:5672/
  exchange: judge.submission.exchange
  main_queue: judge.submission.main
  retry_queue: judge.submission.retry
  dlq: judge.submission.dlq
  worker_prefetch: 1
