[consul]
  host = "127.0.0.1:8500"
  service_name = "JudgeCore"
  service_id = "JudgeCore-1"

[rabbitmq]
  host = "amqp://rabbitmq:password@localhost:5672/"

[server]
  host = "127.0.0.1"
  port = 37885
  enable_https = false
  cert_path = "./certificate/fullchain.pem"
  key_path = "./certificate/privkey.key"

[sandbox]
  memory = 2147483648
  nano_cpus = 0.5
  cpu_shares = 1024
  max_concurrent = 5

[database]
  type = "mysql"
  host = "127.0.0.1"
  port = 3306
  name = "feasoj"
  user = "feasoj"
  password = "password"
  ssl_mode = "disable"
